name: pypi-publish

# Builds the wheel + sdist on every tag push and publishes to PyPI via the
# PyPI Trusted Publisher (OIDC) flow. No API token needed; the workflow's
# id-token is exchanged with PyPI for an upload credential.
#
# One-time setup before the first release:
#   1. Create a "pending publisher" on https://pypi.org/manage/account/publishing/
#      with: project=cfprompt, owner=<your-gh-org-or-user>,
#      repo=cfprompt, workflow=pypi-publish.yml, environment=pypi.
#   2. Add a GitHub Environment named `pypi` (Settings -> Environments).
#      Optional: require manual approval before publish.
#
# Subsequent releases: tag and push -> this workflow runs automatically.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd        # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405    # v6.2.0
        with:
          python-version: "3.11"
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: python -m build
      - run: pip install --no-deps dist/*.whl
      - run: python -c "import cfprompt; print(cfprompt.__version__)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc  # v1.12.4
