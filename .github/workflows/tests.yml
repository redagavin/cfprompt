name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd        # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405    # v6.2.0
        with:
          python-version: "3.11"
          cache: ''
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install -e . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      # Coverage threshold is intentionally below the long-term target while
      # the suite is still maturing; raise incrementally as new tests land.
      - run: pytest -m "unit or integration or smoke" --cov=cfprompt --cov-fail-under=80
