data: data/your_data.csv
perturb_column: question
target_perturbation: perturbations:my_perturbation

prompt_template: |
  Question: {question}
  Answer:

target_model:
  type: HFModel
  name_or_path: meta-llama/Llama-3.2-1B
  dtype: float16

paraphrase_model:
  type: OpenAIModel
  name: gpt-4.1
  temperature: 0.0

classes: [A, B, C, D]

# (Optional, all-or-nothing) Directional regression
# direction_column: swap_direction
# outcome_class_column: outcome_class
# alternative: greater

tolerance: 0.5
max_retries: 50

cache_dir: ./cache
seed: 42
n_bootstrap: 1000

metrics: [jsd, flip_rate]
regression_model: difference

output: results.xlsx
